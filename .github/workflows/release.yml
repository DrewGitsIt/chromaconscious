# A release is a deploy. Pushing a v* tag (`npm version minor` does it) runs
# CI, deploys that exact commit to Cloudflare, and only then publishes the
# GitHub Release, so every Release on the repo is something that went live.
#
# To redeploy an existing release, run this workflow by hand and pick the tag
# under "Use workflow from".
#
# Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID on the `prod`
# environment.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: prod
  cancel-in-progress: false

permissions:
  contents: read

# bash with pipefail: a failing command never hides behind a pipe
defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy and publish
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: prod
      url: https://drewkidwell.com/chromaconscious/
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Require a version tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::Run this from a v* tag, not ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v5
        with:
          # the notes need history back to the previous tag
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Tag matches package.json
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$want" ]; then
            echo "::error::Tag $TAG does not match package.json ($want)."
            exit 1
          fi

      - run: npm ci
      - run: npm run build:cf

      - name: Deploy to Cloudflare
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler's machine-readable record of the deploy, one JSON object a line
          WRANGLER_OUTPUT_FILE_PATH: /tmp/wrangler-output.ndjson
        run: |
          npx wrangler deploy --tag "$TAG" --message "$TAG ${GITHUB_SHA::7}"
          version=$(node -e '
            const lines = require("fs").readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8").split("\n")
            const deploy = lines.filter(Boolean).map(JSON.parse).find((e) => e.type === "deploy")
            process.stdout.write(deploy?.version_id ?? "")')
          if [ -z "$version" ]; then
            echo "::error::wrangler reported no deployed version."
            exit 1
          fi
          echo "worker_version=$version" >> "$GITHUB_OUTPUT"

      # A 200 is not enough: the previous deploy answers 200 too. The live page
      # must load this build's bundle.
      - name: Smoke test
        run: |
          bundle=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist-cf/chromaconscious/index.html | head -1)
          for _ in $(seq 12); do
            if curl -fsS https://drewkidwell.com/chromaconscious/ | grep -qF "$bundle"; then
              echo "live page serves $bundle"
              curl -fsS https://drewkidwell.com/api/chromaconscious/v1 | head -1
              exit 0
            fi
            sleep 5
          done
          echo "::error::the live page does not serve $bundle after 60 s."
          exit 1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_VERSION: ${{ steps.deploy.outputs.worker_version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; redeployed only."
            exit 0
          fi
          node scripts/release-notes.mjs "$TAG" --worker "$WORKER_VERSION" > /tmp/notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/notes.md
